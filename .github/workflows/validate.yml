name: validate-catalog

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - run: python3 scripts/validate_catalog.py
      - run: python3 scripts/generate_views.py
      - run: git diff --exit-code -- docs/catalog.md docs/coverage.md
      - run: python3 scripts/generate_site.py
      - run: python3 scripts/check_site.py
      - run: node --check web/app.js
